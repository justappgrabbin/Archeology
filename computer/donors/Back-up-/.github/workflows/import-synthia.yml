name: Import verified Synthia release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-synthia.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: synthia-public-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out backup repository
        uses: actions/checkout@v4

      - name: Download and verify public release
        env:
          RELEASE_URL: https://leisphnjslcuepflefri.supabase.co/storage/v1/object/public/synth-outputs/synthia-builds/Synthia-Integrated-Automata-v0.5.0-PUBLIC.zip
          RELEASE_SHA256: 599d8d33e2325a050d1a72444b149f2f1400af09784ae27ac84692409358a424
        run: |
          set -euo pipefail
          mkdir -p .import
          curl --fail --location --silent --show-error "$RELEASE_URL" --output .import/synthia.zip
          echo "$RELEASE_SHA256  .import/synthia.zip" | sha256sum --check -
          unzip -q .import/synthia.zip -d .import/tree
          package_root=".import/tree/Synthia-Integrated-Automata-v0.5.0"
          test -f "$package_root/package.json"
          if find "$package_root/authorities/originals" -type f -print -quit 2>/dev/null | grep -q .; then
            echo "Raw donor archives must not enter the public repository." >&2
            exit 1
          fi

      - name: Replace repository tree with verified release
        run: |
          set -euo pipefail
          package_root=".import/tree/Synthia-Integrated-Automata-v0.5.0"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .import -exec rm -rf {} +
          cp -a "$package_root"/. .
          rm -rf .import

      - name: Commit imported source tree
        run: |
          set -euo pipefail
          git config user.name "Synthia Release Import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository already matches the verified release."
            exit 0
          fi
          git commit -m "Import Synthia Integrated Automata v0.5.0 public release [skip ci]"
          git push
