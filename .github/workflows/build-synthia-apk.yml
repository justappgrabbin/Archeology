name: Build Synthia Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-read-text
  pull_request:
    paths:
      - 'computer/**'
      - '.github/workflows/build-synthia-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout complete source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK dependencies
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-35' 'build-tools;35.0.0' \
            'ndk;27.0.12077973' 'cmake;3.22.1'

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --prefix computer/shell/kimi-linux --registry=https://registry.npmjs.org

      - name: Install existing ephemeris test dependency
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install ephem==4.2.1
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Run computer tests and build frontend
        run: |
          npm run test:computer
          npm run build:desktop

      - name: Stage existing computer assets
        run: python3 computer/android/prepare-assets.py

      - name: Download and verify pinned nodejs-mobile
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output node-mobile.zip \
            https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
          echo 'bd7321eaa1a7602fbe0bb87302df2d79d87835cf4363fbdd17c350dbb485c2af  node-mobile.zip' | sha256sum -c -
          python3 computer/android/prepare-node.py node-mobile.zip

      - name: Assemble debug APKs
        run: gradle -p computer/android :app:assembleDebug --no-daemon

      - name: Upload ARM64 phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Synthia-Computer-Android-arm64
          path: computer/android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64 emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: Synthia-Computer-Android-x86_64
          path: computer/android/app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 30
